openapi: 3.1.0
info:
  description: |-
    API del MVP de WEVEH (docs/api.md). Todas las rutas bajo /api exigen
    Authorization: Bearer <token de Supabase Auth> (ADR 0005). Los errores siguen Problem
    Details (RFC 9457). Este contrato se genera del código: no se edita a mano.
  title: WEVEH API
  version: 0.1.0
servers:
- description: Render
  url: https://weveh-backend.onrender.com
security:
- supabase: []
paths:
  /api/v1/catalogo/marcas:
    get:
      operationId: marcas
      parameters:
      - in: query
        name: tipo
        required: false
        schema:
          type: string
          enum:
          - CARRO
          - MOTO
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarcaCatalogo"
          description: OK
      tags:
      - catalogo-controller
  /api/v1/catalogo/marcas/{marcaId}/lineas:
    get:
      operationId: lineas
      parameters:
      - in: path
        name: marcaId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: tipo
        required: false
        schema:
          type: string
          enum:
          - CARRO
          - MOTO
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineaCatalogo"
          description: OK
      tags:
      - catalogo-controller
  /api/v1/cuenta:
    delete:
      operationId: eliminar_1
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      responses:
        "200":
          description: OK
      tags:
      - cuenta-controller
    get:
      operationId: obtener_1
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
          description: OK
      tags:
      - cuenta-controller
    post:
      operationId: crear
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreacionSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
          description: OK
      tags:
      - cuenta-controller
    put:
      operationId: editar_1
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
          description: OK
      tags:
      - cuenta-controller
  /api/v1/cuenta/consentimientos:
    post:
      operationId: aceptarPolitica
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentimientoSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CuentaRespuesta"
          description: OK
      tags:
      - cuenta-controller
  /api/v1/vehiculos:
    get:
      operationId: listar
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
    post:
      operationId: registrar
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
  /api/v1/vehiculos/{id}:
    delete:
      operationId: eliminar
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      tags:
      - vehiculo-controller
    get:
      operationId: obtener
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
    put:
      operationId: editar
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
  /api/v1/vehiculos/{id}/kilometraje:
    put:
      operationId: actualizarKilometraje
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilometrajeSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
  /api/v1/vehiculos/{id}/kilometraje/correccion:
    put:
      operationId: corregirKilometraje
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorreccionKilometrajeSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
  /api/v1/vehiculos/{id}/registro:
    put:
      operationId: completarRegistro
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletarRegistroSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VehiculoRespuesta"
          description: OK
      tags:
      - vehiculo-controller
  /api/v1/vehiculos/{vehiculoId}/consultas:
    post:
      operationId: consultar
      parameters:
      - in: query
        name: usuario
        required: true
        schema:
          $ref: "#/components/schemas/UsuarioId"
      - in: path
        name: vehiculoId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaSolicitud"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagnosticoRespuesta"
          description: OK
      tags:
      - consulta-controller
components:
  schemas:
    AtributoLinea:
      type: object
      properties:
        fuente:
          type: string
        origen:
          type: string
          enum:
          - CATALOGO
          - IA_WEB
          - EQUIPO
        valores:
          type: array
          items:
            type: string
    AtributosLinea:
      type: object
      properties:
        combustible:
          $ref: "#/components/schemas/AtributoLinea"
        traccion:
          $ref: "#/components/schemas/AtributoLinea"
        transmision:
          $ref: "#/components/schemas/AtributoLinea"
    CompletarRegistroSolicitud:
      type: object
      properties:
        aceiteFecha:
          type: string
          format: date
        aceiteKm:
          type: integer
          format: int32
        rtmAunNoAplica:
          type: boolean
        rtmFecha:
          type: string
          format: date
        seguroEntidad:
          type: string
        seguroInicio:
          type: string
          format: date
        soatFecha:
          type: string
          format: date
        versionFila:
          type: integer
          format: int32
      required:
      - versionFila
    ConsentimientoRespuesta:
      type: object
      properties:
        aceptadoEn:
          type: string
          format: date-time
        medio:
          type: string
        versionPolitica:
          type: string
    ConsentimientoSolicitud:
      type: object
      properties:
        versionPolitica:
          type: string
          minLength: 1
      required:
      - versionPolitica
    ConsultaSolicitud:
      type: object
      properties:
        sintoma:
          type: string
    CorreccionKilometrajeSolicitud:
      type: object
      properties:
        kilometraje:
          type: integer
          format: int32
      required:
      - kilometraje
    CreacionSolicitud:
      type: object
      properties:
        aceptadoEn:
          type: string
          format: date-time
        medio:
          type: string
          enum:
          - APP_REGISTRO
          - APP_NUEVA_VERSION
          - APP_GOOGLE
        nombre:
          type: string
          minLength: 1
        versionPolitica:
          type: string
          minLength: 1
      required:
      - nombre
      - versionPolitica
    CuentaRespuesta:
      type: object
      properties:
        consentimientos:
          type: array
          items:
            $ref: "#/components/schemas/ConsentimientoRespuesta"
        correo:
          type: string
        nombre:
          type: string
    DiagnosticoRespuesta:
      type: object
      properties:
        aviso:
          type: string
        datosFaltantes:
          type: array
          items:
            type: string
        gravedad:
          type: string
        nivel:
          type: string
        pasos:
          type: array
          items:
            type: string
        piezasRelacionadas:
          type: array
          items:
            type: string
        porQueImporta:
          type: string
        posibleFalla:
          type: string
        requiereMecanico:
          type: boolean
        requiereRevisionHumana:
          type: boolean
        respuestaSegura:
          type: boolean
    EdicionSolicitud:
      type: object
      properties:
        alias:
          type: string
        combustible:
          type: string
          enum:
          - GASOLINA
          - DIESEL
          - GAS
          - HIBRIDO
          - HIBRIDO_ENCHUFABLE
          - ELECTRICO
        fechaMatricula:
          type: string
          format: date
        kmPromedioMes:
          type: integer
          format: int32
        placa:
          type: string
        traccion:
          type: string
        transmision:
          type: string
          enum:
          - AUTOMATICA
          - MECANICA
        uso:
          type: string
          enum:
          - CIUDAD
          - CARRETERA
          - MIXTO
        versionFila:
          type: integer
          format: int32
      required:
      - kmPromedioMes
      - uso
      - versionFila
    KilometrajeSolicitud:
      type: object
      properties:
        confirmado:
          type: boolean
        kilometraje:
          type: integer
          format: int32
        leidoEn:
          type: string
          format: date
      required:
      - kilometraje
    LineaCatalogo:
      type: object
      properties:
        atributos:
          $ref: "#/components/schemas/AtributosLinea"
        cilindradaCc:
          type: integer
          format: int32
        clase:
          type: string
        combustible:
          type: string
        id:
          type: integer
          format: int64
        marcaId:
          type: integer
          format: int64
        nombre:
          type: string
        potenciaKw:
          type: number
        puertas:
          type: integer
          format: int32
        tipoVehiculo:
          type: string
          enum:
          - CARRO
          - MOTO
        traccion:
          type: string
        transmision:
          type: string
    MarcaCatalogo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        tipo:
          type: string
    RegistroSolicitud:
      type: object
      properties:
        aceiteFecha:
          type: string
          format: date
        aceiteKm:
          type: integer
          format: int32
        alias:
          type: string
        anioModelo:
          type: integer
          format: int32
        catalogoLineaId:
          type: integer
          format: int64
        cilindradaCc:
          type: integer
          format: int32
        combustible:
          type: string
          enum:
          - GASOLINA
          - DIESEL
          - GAS
          - HIBRIDO
          - HIBRIDO_ENCHUFABLE
          - ELECTRICO
        fechaMatricula:
          type: string
          format: date
        kilometraje:
          type: integer
          format: int32
        kmPromedioMes:
          type: integer
          format: int32
        linea:
          type: string
        marca:
          type: string
        placa:
          type: string
        rtmAunNoAplica:
          type: boolean
        rtmFecha:
          type: string
          format: date
        seguroEntidad:
          type: string
        seguroInicio:
          type: string
          format: date
        soatFecha:
          type: string
          format: date
        tipo:
          type: string
          enum:
          - CARRO
          - MOTO
        traccion:
          type: string
        transmision:
          type: string
          enum:
          - AUTOMATICA
          - MECANICA
        uso:
          type: string
          enum:
          - CIUDAD
          - CARRETERA
          - MIXTO
      required:
      - anioModelo
      - kilometraje
      - tipo
    UsuarioId:
      type: object
      properties:
        valor:
          type: string
          format: uuid
    VehiculoRespuesta:
      type: object
      properties:
        aceiteFecha:
          type: string
          format: date
        aceiteKm:
          type: integer
          format: int32
        alias:
          type: string
        anioModelo:
          type: integer
          format: int32
        catalogoLineaId:
          type: integer
          format: int64
        cilindradaCc:
          type: integer
          format: int32
        combustible:
          type: string
        datosFaltantes:
          type: array
          items:
            type: string
        fechaMatricula:
          type: string
          format: date
        id:
          type: string
          format: uuid
        kilometraje:
          type: integer
          format: int32
        kmActualizadoEn:
          type: string
          format: date
        kmPromedioMes:
          type: integer
          format: int32
        linea:
          type: string
        marca:
          type: string
        placa:
          type: string
        rtmAunNoAplica:
          type: boolean
        rtmFecha:
          type: string
          format: date
        seguroEntidad:
          type: string
        seguroInicio:
          type: string
          format: date
        soatFecha:
          type: string
          format: date
        tipo:
          type: string
        traccion:
          type: string
        transmision:
          type: string
        uso:
          type: string
        versionFila:
          type: integer
          format: int32
  securitySchemes:
    supabase:
      bearerFormat: JWT
      scheme: bearer
      type: http
