name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar dependencias o secretos rastreados
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|target|dist|\.expo)/|(^|/)\.env$'; then
            echo "Hay archivos que no deben estar en git"; exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Docker viene en ubuntu-latest: aquí sí corren las pruebas de integración con Testcontainers
      - run: ./mvnw -B verify

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
