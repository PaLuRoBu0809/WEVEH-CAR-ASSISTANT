# SonarCloud: un solo proyecto para backend (Java) y mobile (TypeScript).
# Crea el proyecto en sonarcloud.io con esta misma clave antes de que corra la CI,
# y agrega el secreto SONAR_TOKEN en Settings -> Secrets and variables -> Actions.
sonar.projectKey=Isaac200301_WEVEH-CAR-ASSISTANT
sonar.organization=isaac200301
sonar.host.url=https://sonarcloud.io

sonar.sources=backend/src/main,mobile/src
sonar.tests=backend/src/test,mobile/src
sonar.test.inclusions=**/*Test.java,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.expo/**,**/target/**,**/dist/**,mobile/src/app/**,**/*MapperImpl.java
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,mobile/src/app/**

# Java: JaCoCo (generado por backend/pom.xml al correr `mvn test`)
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript: LCOV (generado por `npm test -- --coverage` en mobile/)
sonar.javascript.lcov.reportPaths=mobile/coverage/lcov.info
