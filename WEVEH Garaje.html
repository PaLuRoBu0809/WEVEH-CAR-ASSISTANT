/* ===== Lógica (reglas v1 y nuevas) ===== */
function consumo(p,km){
  if(p.sinDato) return null;
  const a=p.iKm?(km-p.lKm)/p.iKm:0, b=p.iM&&p.lM!=null?p.lM/p.iM:0;
  return Math.max(a,b);
}
/* v2: Urgente = vencida y afecta la seguridad, o pasada 30 % del intervalo; vencida leve = Atención ("Vencido") */
const estado=(c,p)=>c===null?'warn':(c>=1.3||(c>=1&&p&&p.seg))?'err':c>=.85?'warn':'ok';
const labP=(c,st)=>st==='err'?'Urgente':st==='ok'?'Bien':c===null?'Sin dato':c>=1?'Vencido':'Por vencer';
function restante(p,km){
  const c=consumo(p,km); if(c===null) return 'No sabemos cuándo se hizo';
  const a=p.iKm?(km-p.lKm)/p.iKm:0, b=p.iM&&p.lM!=null?p.lM/p.iM:0;
  if(c>=1){ // se muestra lo que ya venció (lo que ocurra primero)
    if(a>=b&&p.iKm) return `Se pasó por ${fmt(km-p.lKm-p.iKm)} km`;
    const m=Math.round(p.lM-p.iM); return `Se pasó por ${m} ${m===1?'mes':'meses'}`;
  }
  const o=[]; if(p.iKm) o.push(`${fmt(p.lKm+p.iKm-km)} km`); if(p.iM&&p.lM!=null){const m=Math.round(p.iM-p.lM);o.push(`${m} ${m===1?'mes':'meses'}`)}
  return 'Faltan '+o.join(' o ');
}
const estadoDoc=d=>d.dias<0?'err':d.dias<=30?'warn':'ok';
function puntos(c){ if(c===null) return 60; if(c<.85) return 100; if(c<1) return 100-(c-.85)/.15*50; return Math.max(0,50-(c-1)/.3*50); }
/* Nivel = peor estado de piezas y documentos (RN-GA-09). El puntaje se recorta a la banda de su nivel para que nunca contradiga el estado. */
function salud(v){
  let w=0,sum=0,worst='ok';
  v.piezas.forEach(p=>{const c=consumo(p,v.km),pw=p.seg?2:1;w+=pw;sum+=pw*puntos(c);const st=estado(c,p);if(st==='err')worst='err';else if(st==='warn'&&worst!=='err')worst='warn'});
  v.docs.forEach(d=>{const st=estadoDoc(d);if(st==='err')worst='err';else if(st==='warn'&&worst!=='err')worst='warn'});
  let raw=Math.round(sum/w), nivel,lo,hi;
  if(worst==='err'){nivel='Urgente';lo=0;hi=39}
  else if(worst==='warn'||raw<70){nivel='Atención';lo=40;hi=69}
  else if(raw<90){nivel='Bien';lo=70;hi=89}
  else {nivel='Excelente';lo=90;hi=100}
  const pct=nivel==='Excelente'?Math.max(lo,Math.min(hi,raw)):Math.round(lo+(hi-lo)*Math.max(0,Math.min(100,raw))/100);
  const cls=nivel==='Urgente'?'err':nivel==='Atención'?'warn':'ok';
  return {pct,nivel,cls};
}
function peor(v){return [...v.piezas].map(p=>({p,c:consumo(p,v.km)})).sort((a,b)=>(b.c??.9)-(a.c??.9))[0]}
function consumos(v){const L=v.comb||[],o=[];for(let i=1;i<L.length;i++)o.push({km:L[i][0],kpg:(L[i][0]-L[i-1][0])/L[i][1],gal:L[i][1],cop:L[i][2]});return o}

const vpill=s=>pill(s.cls,s.nivel,s.nivel==='Excelente'?IC.star:null);
const bar=(pct,cls)=>`<div class="bar" role="img" aria-label="Avance ${pct} por ciento"><i class="${cls}" style="width:${pct}%"></i></div>`;

/* Pendientes de todos los vehículos, del más al menos grave (seguridad pesa más) */
function pendientes(){
  const o=[];
  V.forEach(v=>{
    v.piezas.forEach(p=>{const c=consumo(p,v.km),st=estado(c,p);if(st!=='ok')o.push({v,p,c,st,score:(c??.9)+(p.seg?1:0)+(st==='err'?10:0),txt:p.n,det:restante(p,v.km)})});
    v.docs.forEach(d=>{const st=estadoDoc(d);if(st!=='ok')o.push({v,d,st,score:st==='err'?11:.9+(30-d.dias)/60,txt:d.n,det:d.dias<0?'Vencido':`Vence en ${d.dias} días`})});
  });
  return o.sort((a,b)=>b.score-a.score);
}

function fillDetail(){

  } else {

    else{const last=C[C.length-1],prev=C.slice(Math.max(0,C.length-6),-1),avg=prev.reduce((a,c)=>a+c.kpg,0)/prev.length;
      const cpk=C.reduce((a,c)=>a+c.cop,0)/(C[C.length-1].km-v.comb[0][0]), drop=prev.length>=3&&last.kpg<avg*.85;

  else if(d.upd!==undefined){sheet(`<h2>¿Cuántos km marca el tablero?</h2><label class="hint" for="kmIn">Kilometraje actual</label><input id="kmIn" class="fld" type="number" inputmode="numeric" value="${v.km}"><button class="btn" data-savekm>Guardar</button><button class="btn2" data-cancel>Cancelar</button>`)}
  else if(d.savekm!==undefined){const n=+$('#kmIn').value;if(n<v.km){sheet(`<h2>¿Cambiaste el tablero o te equivocaste antes?</h2><p class="hint">El kilometraje no suele bajar. Revisa el número.</p><button class="btn" data-cancel>Corregir</button>`)}else{v.km=n;closeSheet();render()}}
  else if(d.fuel!==undefined){sheet(`<h2>Registrar tanqueada</h2><label class="hint" for="fKm">Kilometraje del tablero</label><input id="fKm" type="number" inputmode="numeric" value="${v.km}" class="fld"><label class="hint" for="fGal">Galones</label><input id="fGal" type="number" inputmode="decimal" step="0.1" placeholder="Ej. 9.5" class="fld"><label class="hint" for="fCop">Valor pagado (COP)</label><input id="fCop" type="number" inputmode="numeric" placeholder="Ej. 150000" class="fld"><button class="btn" data-savefuel>Guardar</button><button class="btn2" data-cancel>Cancelar</button>`)}
  else if(d.savefuel!==undefined){const km=+$('#fKm').value,gal=+$('#fGal').value,cop=+$('#fCop').value;if(km&&gal&&cop&&km>(v.comb.length?v.comb[v.comb.length-1][0]:0)){if(!v.comb.length)v.comb.push([km-300,0,0]);v.comb.push([km,gal,cop]);if(km>v.km)v.km=km;closeSheet();fillDetail()}else{$('#fGal').focus()}}
  else if(d.cancel!==undefined){closeSheet()}
  if(viewKey(before)!==viewKey(snap())){if(secondary(snap()))H.push(before);else H.length=0;paintBack()}
});
document.addEventListener('input',e=>{if(e.target.id==='kmSim'){veh().km=+e.target.value;fillDetail()}});
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
$('#main').addEventListener('scroll',()=>{$('#fab').classList.toggle('mini',$('#main').scrollTop>24)});
render();
</script>
