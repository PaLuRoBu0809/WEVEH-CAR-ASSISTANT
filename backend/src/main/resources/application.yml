# Configuración solo por variables de entorno. Ver backend/.env.example.
spring:
  application:
    name: weveh
  config:
    # En local lee backend/.env (no se versiona); en la nube se usan variables de entorno
    import: optional:file:.env[.properties]
  datasource:
    url: ${WEVEH_DB_URL:}
    username: ${WEVEH_DB_USUARIO:}
    password: ${WEVEH_DB_CLAVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

weveh:
  cors:
    # Solo para probar la app en el navegador del PC (ej. http://localhost:8081). Vacío en producción.
    origenes: ${WEVEH_CORS_ORIGENES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
