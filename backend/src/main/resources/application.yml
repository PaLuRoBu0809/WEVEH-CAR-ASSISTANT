# Configuración solo por variables de entorno. Ver backend/.env.example.
spring:
  application:
    name: weveh
  config:
    # En local lee backend/.env (no se versiona); en la nube se usan variables de entorno
    import: optional:file:.env[.properties]
  datasource:
    url: ${WEVEH_DB_URL:}
    username: ${WEVEH_DB_USUARIO:}
    password: ${WEVEH_DB_CLAVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

weveh:
  ia:
    # Modelos de OpenRouter en orden de preferencia, separados por coma (docs/adr/0004).
    # Por defecto, modelos gratuitos con salida estructurada: si uno está saturado se prueba el siguiente.
    modelo: ${WEVEH_IA_MODELO:nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,dots-studio/dots-3-note-preview:free}
    openrouter:
      llave: ${OPENROUTER_API_KEY:}
  cors:
    # Solo para probar la app en el navegador del PC (ej. http://localhost:8081). Vacío en producción.
    origenes: ${WEVEH_CORS_ORIGENES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
