# Configuración solo por variables de entorno. Ver backend/.env.example.
server:
  # Render asigna el puerto con PORT (ADR 0008); en local, 8080
  port: ${PORT:8080}

spring:
  application:
    name: weveh
  config:
    # En local lee backend/.env (no se versiona); en la nube se usan variables de entorno
    import: optional:file:.env[.properties]
  datasource:
    url: ${WEVEH_DB_URL:}
    username: ${WEVEH_DB_USUARIO:}
    password: ${WEVEH_DB_CLAVE:}
    # El pooler de Supabase en modo sesión acepta 15 conexiones en total; en un despliegue conviven dos instancias (ADR 0008)
    hikari:
      maximum-pool-size: ${WEVEH_DB_POOL:7}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Audio del micrófono (RF-MIA-11): máximo 60 s, que en AAC caben de sobra en 2 MB
      max-file-size: 2MB
      max-request-size: 2MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        # Tokens de Supabase Auth (ADR 0005): firmados con ES256; las llaves públicas se leen del JWKS del proyecto
        jwt:
          issuer-uri: ${weveh.supabase.url}/auth/v1
          jwk-set-uri: ${weveh.supabase.url}/auth/v1/.well-known/jwks.json
          # Sin esto Spring solo acepta RS256 y rechaza todos los tokens de Supabase (ES256) con 401
          jws-algorithms: ES256
          audiences: authenticated

weveh:
  supabase:
    # URL pública del proyecto weveh (no es secreta)
    url: ${WEVEH_SUPABASE_URL:https://yrqjxgpskkhjhkkthimm.supabase.co}
    # Llave service_role: solo para borrar la cuenta en Supabase Auth (RF-DAT-06). Secreta: solo en backend/.env
    service-role: ${WEVEH_SUPABASE_SERVICE_ROLE:}
  ia:
    # Modelos de OpenRouter en orden de preferencia, separados por coma (docs/adr/0004).
    # Por defecto, modelos gratuitos con salida estructurada: si uno está saturado se prueba el siguiente.
    modelo: ${WEVEH_IA_MODELO:nvidia/nemotron-3.5-super-vl:free,dots-studio/dots-3-note-preview:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free}
    openrouter:
      llave: ${OPENROUTER_API_KEY:}
    # Voz a texto con Whisper de Groq (ADR 0018, RF-MIA-11): única excepción a OpenRouter; el audio no se guarda.
    groq:
      llave: ${GROQ_API_KEY:}
    transcripcion:
      modelo: ${WEVEH_TRANSCRIPCION_MODELO:whisper-large-v3-turbo}
  cors:
    # Solo para probar la app en el navegador del PC (ej. http://localhost:8081). Vacío en producción.
    origenes: ${WEVEH_CORS_ORIGENES:}

sentry:
  # ADR 0010 y RNF-23: sin DSN no se envía nada; nunca datos personales (FiltroSentry borra lo que quede)
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0

springdoc:
  # ADR 0012: el contrato se genera en la prueba ContratoOpenApiTest (contracts/openapi.yaml). Apagado en producción.
  api-docs:
    enabled: ${WEVEH_OPENAPI:false}
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # ADR 0010: salud por módulo (módulos encendidos o apagados, cortacircuitos de la IA, base de datos).
      # Los detalles no llevan datos de personas ni llaves.
      show-components: always
      show-details: always
